<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pl-logo-w-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pl-logo-w-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (Scaled to 70x70, centered at 40,40) -->
  <g transform="translate(6, 6) scale(0.7)">
    <!-- Signal Node Dots -->
    <circle cx="15" cy="50" r="2.5" fill="#2dd4bf" opacity="0.8" />
    <circle cx="85" cy="50" r="2.5" fill="#2dd4bf" opacity="0.8" />
    <circle cx="50" cy="88" r="2.5" fill="#38bdf8" />

    <!-- Outer Left Toe -->
    <ellipse cx="26" cy="36" rx="6.5" ry="9" transform="rotate(-24 26 36)" fill="url(#pl-logo-w-primary)" />
    <ellipse cx="24.5" cy="33.5" rx="3" ry="5" transform="rotate(-24 24.5 33.5)" fill="#a7f3d0" opacity="0.5" />

    <!-- Inner Left Toe -->
    <ellipse cx="41.5" cy="25" rx="7" ry="10" transform="rotate(-8 41.5 25)" fill="url(#pl-logo-w-primary)" />
    <ellipse cx="40" cy="22" rx="3" ry="5.5" transform="rotate(-8 40 22)" fill="#a7f3d0" opacity="0.5" />

    <!-- Inner Right Toe -->
    <ellipse cx="58.5" cy="25" rx="7" ry="10" transform="rotate(8 58.5 25)" fill="url(#pl-logo-w-primary)" />
    <ellipse cx="57" cy="22" rx="3" ry="5.5" transform="rotate(8 57 22)" fill="#a7f3d0" opacity="0.5" />

    <!-- Outer Right Toe -->
    <ellipse cx="74" cy="36" rx="6.5" ry="9" transform="rotate(24 74 36)" fill="url(#pl-logo-w-primary)" />
    <ellipse cx="72.5" cy="33.5" rx="3" ry="5" transform="rotate(24 72.5 33.5)" fill="#a7f3d0" opacity="0.5" />

    <!-- Upper Central Main Pad -->
    <path d="M 37 46 C 37 42, 42 38, 50 38 C 58 38, 63 42, 63 46 C 63 52, 57 56, 50 58 C 43 56, 37 52, 37 46 Z"
          fill="url(#pl-logo-w-primary)" />
    <ellipse cx="50" cy="43.5" rx="7" ry="2.5" fill="#a7f3d0" opacity="0.5" />

    <!-- Seamless Infinity Link Loop -->
    <path d="M 50 58 
             C 42 49, 29 49, 24 55
             C 17 62, 18 73, 26 77
             C 35 81, 45 70, 50 63
             C 55 70, 65 81, 74 77
             C 82 73, 83 62, 76 55
             C 71 49, 58 49, 50 58 Z"
          fill="none"
          stroke="url(#pl-logo-w-primary)"
          stroke-width="6.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <path d="M 50 58 
             C 42 49, 29 49, 24 55
             C 17 62, 18 73, 26 77
             C 35 81, 45 70, 50 63
             C 55 70, 65 81, 74 77
             C 82 73, 83 62, 76 55
             C 71 49, 58 49, 50 58 Z"
          fill="none"
          stroke="url(#pl-logo-w-accent)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <circle cx="50" cy="61.5" r="3.5" fill="#ffffff" />
  </g>

  <!-- Wordmark Typography -->
  <text x="86" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.03em" fill="#ffffff">
    Paw<tspan fill="url(#pl-logo-w-primary)">Link</tspan>
  </text>

  <!-- Tagline Subtitle -->
  <text x="87" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.22em" fill="#2dd4bf" text-transform="uppercase">
    SMART PET RECOVERY
  </text>
</svg>
