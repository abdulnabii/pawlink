<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant Emerald-Teal Primary Gradient -->
    <linearGradient id="pl-grad-primary" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Accent Luminous Cyan Highlight -->
    <linearGradient id="pl-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Background Squircle Gradient -->
    <linearGradient id="pl-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="pl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pl-subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Icon Squircle (Subtle border) -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#pl-bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Radar & Telemetry Signal Arcs -->
  <g stroke="url(#pl-grad-primary)" opacity="0.45" stroke-linecap="round" fill="none">
    <path d="M 20 60 A 42 42 0 0 1 30 32" stroke-width="2.5" stroke-dasharray="2 6" />
    <path d="M 90 32 A 42 42 0 0 1 100 60" stroke-width="2.5" stroke-dasharray="2 6" />
    <path d="M 38 98 A 38 38 0 0 0 82 98" stroke-width="2" stroke-dasharray="3 5" />
  </g>

  <!-- Signal Node Dots -->
  <circle cx="20" cy="60" r="2" fill="#2dd4bf" opacity="0.8" />
  <circle cx="100" cy="60" r="2" fill="#2dd4bf" opacity="0.8" />
  <circle cx="60" cy="102" r="2.5" fill="#38bdf8" filter="url(#pl-subtle-glow)" />

  <!-- The Paw Toe Nodes (4 Digital / Organic Pads) -->
  <!-- Outer Left Toe -->
  <ellipse cx="33" cy="45" rx="7.5" ry="10" transform="rotate(-24 33 45)" fill="url(#pl-grad-primary)" filter="url(#pl-subtle-glow)" />
  <ellipse cx="31.5" cy="42" rx="3.5" ry="5.5" transform="rotate(-24 31.5 42)" fill="#a7f3d0" opacity="0.4" />

  <!-- Inner Left Toe -->
  <ellipse cx="50" cy="33" rx="8" ry="11.5" transform="rotate(-8 50 33)" fill="url(#pl-grad-primary)" filter="url(#pl-subtle-glow)" />
  <ellipse cx="48.5" cy="29.5" rx="3.5" ry="6.5" transform="rotate(-8 48.5 29.5)" fill="#a7f3d0" opacity="0.4" />

  <!-- Inner Right Toe -->
  <ellipse cx="70" cy="33" rx="8" ry="11.5" transform="rotate(8 70 33)" fill="url(#pl-grad-primary)" filter="url(#pl-subtle-glow)" />
  <ellipse cx="68.5" cy="29.5" rx="3.5" ry="6.5" transform="rotate(8 68.5 29.5)" fill="#a7f3d0" opacity="0.4" />

  <!-- Outer Right Toe -->
  <ellipse cx="87" cy="45" rx="7.5" ry="10" transform="rotate(24 87 45)" fill="url(#pl-grad-primary)" filter="url(#pl-subtle-glow)" />
  <ellipse cx="85.5" cy="42" rx="3.5" ry="5.5" transform="rotate(24 85.5 42)" fill="#a7f3d0" opacity="0.4" />

  <!-- Upper Central Main Pad (Smooth Crown) -->
  <path d="M 44 57 C 44 53, 50 49, 60 49 C 70 49, 76 53, 76 57 C 76 64, 69 68, 60 70 C 51 68, 44 64, 44 57 Z"
        fill="url(#pl-grad-primary)" />
  <ellipse cx="60" cy="54" rx="8" ry="3" fill="#a7f3d0" opacity="0.4" />

  <!-- Seamless Infinity Link Loop (The 'Link') Interwoven Underneath -->
  <path d="M 60 70 
           C 51 60, 36 60, 30 67
           C 22 75, 23 88, 33 93
           C 43 97, 54 85, 60 76
           C 66 85, 77 97, 87 93
           C 97 88, 98 75, 90 67
           C 84 60, 69 60, 60 70 Z"
        fill="none"
        stroke="url(#pl-grad-primary)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#pl-glow)" />

  <!-- Internal Inner Glow Line for High-Tech Edge -->
  <path d="M 60 70 
           C 51 60, 36 60, 30 67
           C 22 75, 23 88, 33 93
           C 43 97, 54 85, 60 76
           C 66 85, 77 97, 87 93
           C 97 88, 98 75, 90 67
           C 84 60, 69 60, 60 70 Z"
        fill="none"
        stroke="url(#pl-grad-accent)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Central Intersecting Sparkle / Radar Beacon Dot -->
  <circle cx="60" cy="74" r="3.5" fill="#ffffff" filter="url(#pl-glow)" />
</svg>
