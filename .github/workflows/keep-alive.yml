name: Keep-Alive Supabase Ping

on:
  schedule:
    # Runs at 04:00 UTC every 2 days to prevent Supabase 7-day inactivity pause
    - cron: '0 4 */2 * *'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PawLink Health Check
        run: |
          response=$(curl -s "https://pawlink-chi.vercel.app/api/health")
          echo "Health response: $response"
